name: build-lab-image
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ['docker/**', '.github/workflows/build-lab-image.yml']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hosted runners ship ~14G free; the Kali build needs ~20G.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nyx-lab:latest
            ghcr.io/${{ github.repository_owner }}/nyx-lab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
